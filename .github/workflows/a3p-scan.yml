name: a3p-scan

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ./.github/actions/a3p
        with:
          config: demos/configs/openai-mock.yaml
          output: out/a3p-scan
          sarif: a3p.sarif
      - name: Comment on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' > /tmp/a3p-comment.md
          import json
          from pathlib import Path
          report = json.loads(Path("out/a3p-scan/results.json").read_text(encoding="utf-8"))
          meta = report.get("meta") or {}
          failed = sum(1 for item in report.get("results") or [] if not item.get("passed"))
          print("## A3P scan")
          print()
          print(meta.get("assessment") or "assessed under A3P Method v1.0")
          print()
          print(f"Score {report.get('overall')} · band {report.get('band')} · {failed} findings.")
          print()
          print("This is a sample. It is not a statement that the agent is safe.")
          print("SARIF is attached to the security tab.")
          PY
          gh pr comment "$PR" --body-file /tmp/a3p-comment.md
