name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev,sigstore,mcp,world,agents,ui]" -c requirements/lock.txt
      - name: Browser
        run: python -m playwright install --with-deps chromium
      - name: MinIO
        run: |
          curl -fsSL -o /usr/local/bin/minio -L \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z
          chmod +x /usr/local/bin/minio
      - name: Lint
        run: python -m ruff check src tests
      - name: Types
        run: python -m mypy src
      - name: Test
        run: python -m pytest --cov=a3p --cov-report=term-missing --cov-fail-under=90
      - name: Bandit
        run: python -m bandit -r src -x src/a3ep -ll -q
      - name: Dependency audit
        run: python -m pip_audit -r requirements/lock.txt --disable-pip --no-deps --progress-spinner off

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,world,mcp]" -c requirements/lock.txt
      - name: Sandbox image
        run: docker pull python:3.12-slim
      - name: Postgres, Mailpit, and container isolation
        env:
          A3P_REQUIRE_DOCKER: "1"
          A3P_SANDBOX_IMAGE: python:3.12-slim
        run: python -m pytest -m integration -q --override-ini addopts=

  jails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,mcp]" -c requirements/lock.txt
      - name: gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update
          sudo apt-get install -y runsc
      - name: nsjail
        run: |
          sudo apt-get install -y protobuf-compiler libprotobuf-dev libnl-route-3-dev pkg-config flex bison build-essential git
          git clone --depth 1 https://github.com/google/nsjail /tmp/nsjail
          make -C /tmp/nsjail -j"$(nproc)"
          sudo install -m 755 /tmp/nsjail/nsjail /usr/local/bin/nsjail
      - name: Jail tests
        run: python -m pytest tests/test_jails.py -q --override-ini addopts=

  sigstore-keyless:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev,sigstore]" -c requirements/lock.txt
      - name: Sign and verify with Fulcio and Rekor
        env:
          A3P_REQUIRE_SIGSTORE: "1"
        run: python -m pytest tests/test_sigstore_live.py -q
