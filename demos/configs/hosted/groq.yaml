# Groq's OpenAI-compatible endpoint. Set GROQ_API_KEY.
meta:
  client: Local
  agent_name: Groq
  agent_version: ${A3P_MODEL:-llama-3.1-8b-instant}
  scope: Probe-owned tools. No live side effects.
  auditor: local
target:
  adapter: openai
  base_url: ${A3P_BASE_URL:-https://api.groq.com/openai/v1}
  model: ${A3P_MODEL:-llama-3.1-8b-instant}
  api_key: ${GROQ_API_KEY:-}
  timeout_s: 60
  retries: 2
output:
  directory: out/hosted-groq
